apiVersion: v1 # TODO: move namespace declaration from pv's
kind: Namespace
metadata:
  labels:
    devops.kmontocam.com: "true"
    devops.kmontocam.com/service: jenkins
    kmontocam.com/environment: prod
  name: jenkins
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    devops.kmontocam.com: "true"
    kmontocam.com/environment: prod
  name: monitoring
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    api.kmontocam.com: "true"
    api.kmontocam.com/service: cnpg
    kmontocam.com/environment: prod
  name: usb-sdb1
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 16Gi
  hostPath:
    path: /mnt/usb-sdb1
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
